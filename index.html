<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1c1e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>Filament Vault</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f2f2f7}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:30px;font-weight:800}.count{color:#666;font-size:14px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #00000012}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.button{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#1c1c1e;color:white}.button.secondary{background:#e5e5ea;color:#111}.button.danger{background:#ff3b30}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;font-size:16px}.row{display:flex;gap:14px;align-items:center}.dot{width:42px;height:42px;border-radius:50%;border:1px solid #ddd;flex:none}.record h2{margin:0 0 4px}.muted{color:#666}.pill{display:inline-block;background:#eee;padding:5px 9px;border-radius:10px;font-size:13px;margin-right:5px}.hero{font-size:34px;font-weight:800}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d1d1d6;border-radius:12px;font-size:16px;background:white}.field textarea{min-height:90px}.footer{color:#777;font-size:12px;text-align:center;margin-top:20px}.hidden{display:none!important}.back{border:0;background:none;font-size:16px;padding:4px 0}.notice{padding:12px;border-radius:12px;background:#fff4ce;margin:10px 0;font-size:14px}.photo{width:100%;max-height:330px;object-fit:contain;border-radius:14px;background:#eee;margin-top:12px}.empty{text-align:center;padding:35px 10px;color:#666}.small{font-size:13px}.linkbox{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:#f2f2f7;padding:10px;border-radius:10px}.nav{display:flex;gap:8px;margin-bottom:12px}.nav button{flex:1}.color-name{font-weight:600}
</style></head><body><main class="app" id="app"></main><script>
const KEY='filamentVault.v1';
const materials=['PLA','PLA+','PETG','TPU','Unknown'];
const colors=['Black','White','Red','Blue','Green','Yellow','Orange','Purple','Pink','Grey','Brown','Gold','Silver','Copper','Natural','Multicolour','Other'];
let db=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{next:1,items:[]}}catch(e){return{next:1,items:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function idFromUrl(){return new URLSearchParams(location.search).get('id')}
function go(path=''){history.pushState({},'',location.pathname+path);render()}
window.onpopstate=render;
function render(){let id=idFromUrl(); if(id){let item=db.items.find(x=>x.id===id); return item?detail(item):detailMissing(id)} home()}
function home(){document.getElementById('app').innerHTML=`<div class="top"><div><div class="title">Filament Vault</div><div class="count">${db.items.length} filament${db.items.length===1?'':'s'}</div></div></div><div class="actions"><button class="button" onclick="add()">＋ Add Filament</button><button class="button secondary" onclick="backup()">Export Backup</button></div><div class="card"><input class="search" id="search" placeholder="Search material, colour or brand…" oninput="list()"></div><div id="list"></div><div class="footer">Your filament records are stored on this iPhone only.</div>`;list()}
function list(){let q=(document.getElementById('search')?.value||'').toLowerCase();let items=db.items.filter(x=>[x.id,x.material,x.color,x.brand,x.notes].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.id.localeCompare(b.id));let el=document.getElementById('list'); if(!items.length){el.innerHTML='<div class="empty">No matching filaments.<br><br>Tap <b>Add Filament</b> to register your first bag.</div>';return}el.innerHTML=items.map(x=>`<div class="card" onclick="go('?id=${encodeURIComponent(x.id)}')"><div class="row"><div class="dot" style="background:${cssColor(x.color)}"></div><div><div><span class="pill">${esc(x.material)}</span><b>${esc(x.color)}</b></div><div class="muted">${esc(x.brand||'Brand unknown')} · ${esc(x.id)}</div></div></div></div>`).join('')}
function cssColor(c){return ({Black:'#111',White:'#fff',Red:'#e53935',Blue:'#2979ff',Green:'#43a047',Yellow:'#fdd835',Orange:'#fb8c00',Purple:'#8e24aa',Pink:'#ec407a',Grey:'#9e9e9e',Brown:'#795548',Gold:'#d4af37',Silver:'#c0c0c0',Copper:'#b87333',Natural:'#e6d3ad',Multicolour:'linear-gradient(90deg,#e33,#fd3,#3c6,#48f,#a5f)'}[c]||'#ddd')}
function add(){editForm(null)}
function detail(x){document.getElementById('app').innerHTML=`<button class="back" onclick="go('')">‹ All filaments</button><div class="card record"><div class="hero">${esc(x.color)} ${esc(x.material)}</div><div class="muted">${esc(x.id)}</div><hr><p><b>Material</b><br>${esc(x.material)}</p><p><b>Colour</b><br>${esc(x.color)}</p><p><b>Brand</b><br>${esc(x.brand||'—')}</p>${x.photo?`<img class="photo" src="${x.photo}" alt="Spool photo">`:''}${x.notes?`<p><b>Notes</b><br>${esc(x.notes).replace(/\n/g,'<br>')}</p>`:''}<div class="actions"><button class="button" onclick="editForm(db.items.find(x=>x.id==='${x.id}'))">✏️ Edit</button><button class="button secondary" onclick="showUrl('${x.id}')">NFC URL</button></div><button class="button danger" style="width:100%;margin-top:10px" onclick="removeItem('${x.id}')">Delete</button></div>`}
function detailMissing(id){document.getElementById('app').innerHTML=`<div class="card"><h2>FIL-${esc(id.replace(/^FIL-/i,''))} not found</h2><p class="muted">The NFC tag opened this ID, but there is no matching record on this iPhone.</p><button class="button" onclick="addFor('${esc(id)}')">Create this record</button><button class="button secondary" style="margin-top:10px;width:100%" onclick="go('')">Back</button></div>`}
function addFor(id){editForm({id:id.toUpperCase(),material:'Unknown',color:'Other',brand:'',notes:'',photo:''},true)}
function editForm(x,isNew=false){x=x||{id:'FIL-'+String(db.next).padStart(3,'0'),material:'PLA',color:'Black',brand:'',notes:'',photo:''};document.getElementById('app').innerHTML=`<button class="back" onclick="${x.id?`go('?id=${encodeURIComponent(x.id)}')`:`go('')`}">‹ Cancel</button><div class="card"><h2>${isNew?'Create':'Edit'} ${esc(x.id)}</h2><div class="field"><label>Material</label><select id="material">${materials.map(v=>`<option ${v===x.material?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Colour</label><select id="color">${colors.map(v=>`<option ${v===x.color?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Brand (optional)</label><input id="brand" value="${esc(x.brand)}" placeholder="e.g. eSUN"></div><div class="field"><label>Photo (optional)</label><input id="photoFile" type="file" accept="image/*" capture="environment" onchange="photoChanged(event)"><img id="preview" class="photo ${x.photo?'':'hidden'}" src="${x.photo||''}"></div><div class="field"><label>Notes (optional)</label><textarea id="notes" placeholder="Anything useful about this spool…">${esc(x.notes)}</textarea></div><button class="button" style="width:100%" onclick="saveForm('${esc(x.id)}')">Save Filament</button></div>`;window.pendingPhoto=x.photo||''}
function photoChanged(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window.pendingPhoto=r.result;let p=document.getElementById('preview');p.src=r.result;p.classList.remove('hidden')};r.readAsDataURL(f)}
function saveForm(id){let existing=db.items.find(x=>x.id===id);let x={id,material:document.getElementById('material').value,color:document.getElementById('color').value,brand:document.getElementById('brand').value.trim(),notes:document.getElementById('notes').value.trim(),photo:window.pendingPhoto||''};if(existing)Object.assign(existing,x);else{db.items.push(x);let n=parseInt(id.replace(/\D/g,''),10);if(n>=db.next)db.next=n+1}save();go('?id='+encodeURIComponent(id))}
function removeItem(id){if(confirm('Delete '+id+'? This cannot be undone.')){db.items=db.items.filter(x=>x.id!==id);save();go('')}}
function showUrl(id){let url=location.origin+location.pathname+'?id='+encodeURIComponent(id);document.getElementById('app').innerHTML=`<button class="back" onclick="go('?id=${encodeURIComponent(id)}')">‹ Back</button><div class="card"><h2>NFC URL for ${esc(id)}</h2><p>Use your existing NFC-writing app to write this URL to the sticker.</p><div class="linkbox">${esc(url)}</div><button class="button" style="width:100%;margin-top:12px" onclick="navigator.clipboard?.writeText('${esc(url)}');alert('URL copied')">Copy URL</button><p class="small muted">Once written, holding your iPhone near the sticker should open this record.</p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='filament-vault-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
